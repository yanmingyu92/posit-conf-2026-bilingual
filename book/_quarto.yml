project:
  type: book
  output-dir: _book
  resources:
    - downloads/

book:
  title: "现代 R 进阶"
  subtitle: "Modern R in Practice · 从分析脚本到可信赖的交付物"
  author: "Jaime Yan"
  cover-image: assets/cover.svg
  description: "面向已有 R 基础的分析人员，以交付任务串联分析、可视化、应用与软件工程，并提供临床研究和制药领域的阅读路径。"
  site-url: "https://yanmingyu92.github.io/posit-conf-2026-bilingual/book/"
  repo-url: "https://github.com/yanmingyu92/posit-conf-2026-bilingual"
  chapters:
    - index.qmd
    - preface.qmd
    - reading-guide.qmd
    - companion.qmd
    - part: unit-1.qmd
      chapters:
        - chapters/01-functions.qmd
        - chapters/12-iteration.qmd
        - chapters/13-efficient-code.qmd
        - chapters/14-json-apis.qmd
        - chapters/15-web-scraping.qmd
        - chapters/16-great-tables.qmd
        - chapters/17-alt-geoms.qmd
        - chapters/18-styled-plots.qmd
    - part: unit-2.qmd
      chapters:
        - chapters/21-interactive-graphics.qmd
        - chapters/22-animation.qmd
        - chapters/23-dashboards-static.qmd
        - chapters/24-dashboards-dynamic.qmd
        - chapters/25-maps-leaflet.qmd
        - chapters/26-ggplot-extensions.qmd
        - chapters/27-shiny-reactive.qmd
        - chapters/28-pub-ready-reports.qmd
    - part: unit-3.qmd
      chapters:
        - chapters/31-pkg-structure.qmd
        - chapters/32-unit-testing.qmd
        - chapters/33-debugging.qmd
        - chapters/34-code-speed.qmd
    - part: unit-4.qmd
      chapters:
        - chapters/41-llm-basics.qmd
        - chapters/42-structured-output.qmd
        - chapters/43-agents.qmd
        - chapters/44-skills.qmd
        - chapters/45-rag-mcp.qmd
        - chapters/46-shinychat.qmd
        - chapters/47-clinical-reporting.qmd
        - chapters/48-regulated-gxp.qmd
    - part: "Appendix · 附录"
      chapters:
        - further-reading.qmd
        - unit-1-map.qmd
        - unit-2-map.qmd
        - unit-3-map.qmd
        - unit-4-map.qmd
        - acknowledgments.qmd
  sidebar:
    style: floating

format:
  html:
    theme: cosmo
    lang: zh-CN
    toc: true
    callout-icon: true
    number-sections: false
    css: assets/book.css
