# Bureau of Regional Statistics — the fictional statistical agency used
# across these exercises, so every render looks like one organization
# published it. See the README for how to pull it into a folder.

meta:
  name: Bureau of Regional Statistics
  link:
    home: https://example.gov/brs

logo:
  images:
    mark:
      path: brs-logo.svg
      alt: Bureau of Regional Statistics
  small: mark
  medium: mark
  large: mark

color:
  palette:
    forest: "#1B5E4F"
    slate: "#3D4A54"
    sand: "#EFE9DD"
    ink: "#1F2A2E"
  foreground: ink
  background: white
  primary: forest
  secondary: slate

typography:
  fonts:
    - family: Atkinson Hyperlegible
      source: google
      weight: [400, 600, 700]
      style: [normal, italic]
    - family: Source Code Pro
      source: google
  base: Atkinson Hyperlegible
  headings:
    family: Atkinson Hyperlegible
    weight: 600
  monospace: Source Code Pro
