name: Render Quarto site and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build training download and check book structure
        run: |
          python scripts/build_training_download.py
          python scripts/qa_book_structure.py
          python scripts/qa_book_english.py

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render website
        uses: quarto-dev/quarto-actions/render@v2
        with:
          path: website

      - name: Render book
        uses: quarto-dev/quarto-actions/render@v2
        with:
          path: book

      - name: Render English book
        uses: quarto-dev/quarto-actions/render@v2
        with:
          path: book-en

      - name: Nest both book editions into site
        run: |
          mkdir -p website/_site/book
          cp -r book/_book/* website/_site/book/
          mkdir -p website/_site/book/en
          cp -r book-en/_book/* website/_site/book/en/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
